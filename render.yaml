services:
  - type: web
    name: fastapi-farm-backend
    env: python
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: harvest_db
          property: connectionString

databases:
  - name: harvest_db
    plan: free
    databaseName: harvest_db
    user: harvest_user
